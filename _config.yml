# Site settings
title:          a quiet place
description:    "Only time could tell."
baseurl:        ""
url:            "https://lijianqiang.com"

# Google Analytics
google_analytics:

# Author
author:
  name:         lijianqiang
  url:          https://lijianqiang.com
  email:        mail@lijianqiang.com

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed


remote_theme: chesterhow/tale

plugins:
  - jekyll-paginate
  - jekyll-remote-theme



# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
# disqus:         jekyll-tale
